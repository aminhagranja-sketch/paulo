name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MeuGalinheiro-Windows
          path: build/MeuGalinheiro-Windows.zip
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev libgl1-mesa-dev xvfb
      - run: cmake --preset linux && cmake --build --preset linux --parallel 4 && ctest --preset linux
      - name: Graphical smoke test
        run: mkdir -p build/validation && xvfb-run -a build/linux/meu_galinheiro --smoke --save build/validation/save.json
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Mobile browser integration
        run: |
          python3 -m http.server 8088 --bind 127.0.0.1 --directory web > /tmp/granja-web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          npm run test:web
